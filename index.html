<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C1B2A">
<title>Due North</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --chart:#E8EBE6; --card:#FCFCFA; --card-2:#F1F3EE;
  --ink:#0C1B2A; --ink-2:#495C6E; --ink-3:#7C8A96;
  --rule:#C6CCC4; --rule-2:#DDE1D9;
  --brass:#9C7C12; --brass-bg:#F5EDD2;
  --shoal:#A03A22; --shoal-bg:#F7E2DB;
  --depth:#2A6360; --depth-bg:#DCE9E7;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --pad:16px; --r:3px;
}
@media (prefers-color-scheme:dark){
  :root{
    --chart:#0A1622; --card:#122230; --card-2:#182E3E;
    --ink:#E4EAEF; --ink-2:#9FB0BE; --ink-3:#71838F;
    --rule:#24384A; --rule-2:#1B2C3B;
    --brass:#D9B441; --brass-bg:#2A2718;
    --shoal:#E07A5C; --shoal-bg:#31201B;
    --depth:#59AFA7; --depth-bg:#152A29;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--chart);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.45;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}

/* ---------- type ---------- */
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}
h1{font-size:17px;text-transform:uppercase;letter-spacing:.04em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;font-family:var(--mono);font-weight:700;color:var(--ink-2)}
h3{font-size:15px}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:40;background:var(--card);
  border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top);
}
.hbar{display:flex;align-items:center;gap:10px;padding:11px var(--pad) 9px}
.wordmark{display:flex;align-items:baseline;gap:6px;flex:1;min-width:0}
.wordmark b{font-weight:800;font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.wordmark span{color:var(--brass);font-family:var(--mono);font-size:14px;line-height:1}
.hbtn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--rule);border-radius:var(--r);color:var(--ink-2)}
.hbtn:active{background:var(--card-2)}
.hbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pill{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 7px;border-radius:999px;font-weight:700;white-space:nowrap}
.pill.bad{background:var(--shoal-bg);color:var(--shoal)}
.pill.ok{background:var(--depth-bg);color:var(--depth)}
.pill.warn{background:var(--brass-bg);color:var(--brass)}

/* ---------- SIGNATURE: bearing strip ---------- */
.bearing{padding:0 var(--pad) 8px;overflow:hidden}
.bearing svg{width:100%;height:54px;display:block}
.bs-day{cursor:pointer}
.bs-tick{stroke:var(--rule);stroke-width:1}
.bs-lane{fill:var(--rule-2)}
.bs-mark{rx:1}
.bs-needle{stroke:var(--ink);stroke-width:1.5}
.bs-lt{font-family:var(--mono);font-size:8px;letter-spacing:.06em;fill:var(--ink-3)}
.bs-dt{font-family:var(--mono);font-size:9px;font-weight:700;fill:var(--ink-2)}
.bs-sel{fill:none;stroke:var(--brass);stroke-width:1.5}
.bs-wk{fill:var(--ink);opacity:.035}

/* ---------- layout ---------- */
main{padding:14px var(--pad) 24px;max-width:820px;margin:0 auto}
.sec{margin:0 0 22px}
.sec-h{display:flex;align-items:center;gap:10px;margin:0 0 9px}
.sec-h .line{flex:1;height:1px;background:var(--rule)}
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:13px}
.stack>*+*{margin-top:8px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--ink-3)}
.empty{border:1px dashed var(--rule);border-radius:var(--r);padding:20px 14px;text-align:center;color:var(--ink-3);font-size:13px}

/* ---------- item rows ---------- */
.item{display:flex;gap:11px;background:var(--card);border:1px solid var(--rule);
  border-left:3px solid var(--rule);border-radius:var(--r);padding:10px 11px;align-items:flex-start}
.item.od{border-left-color:var(--shoal)}
.item.soon{border-left-color:var(--brass)}
.item.done{opacity:.5}
.item.done .it-t{text-decoration:line-through}
.chk{flex:none;width:20px;height:20px;border:1.5px solid var(--rule);border-radius:var(--r);
  display:grid;place-items:center;margin-top:1px;color:transparent}
.item.done .chk{border-color:var(--depth);background:var(--depth);color:#fff}
.it-t{font-weight:600;font-size:14.5px;line-height:1.3;word-break:break-word}
.it-m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:3px}
.it-c{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.it-d{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cdown{font-family:var(--mono);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;
  flex:none;text-align:right;padding-top:1px;min-width:52px}
.cdown.od{color:var(--shoal)} .cdown.soon{color:var(--brass)}
.typ{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--rule);border-radius:999px;padding:1px 6px;color:var(--ink-3)}

/* ---------- calendar ---------- */
.cal{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.cal-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--rule)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--rule)}
.dow div{text-align:center;padding:5px 0;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--ink-3)}
.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cell{aspect-ratio:1/1;border-right:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2);
  padding:4px;display:flex;flex-direction:column;gap:2px;position:relative;min-height:44px}
.cell:nth-child(7n){border-right:none}
.cell.out{opacity:.32}
.cell.today .dn{background:var(--ink);color:var(--chart);border-radius:2px}
.cell.sel{outline:1.5px solid var(--brass);outline-offset:-1.5px;z-index:2}
.dn{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;line-height:1.3;
  align-self:flex-start;padding:0 3px;font-weight:600}
.dots{display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start}
.dot{width:5px;height:5px;border-radius:50%}
.cell .heat{position:absolute;inset:0;background:var(--brass);pointer-events:none}

/* ---------- grades ---------- */
.gcard{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.gtop{display:flex;align-items:center;gap:11px;padding:12px}
.gbig{font-family:var(--mono);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.gltr{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink-3)}
.gbody{border-top:1px solid var(--rule);padding:10px 12px 12px;background:var(--card-2)}
.catrow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--rule-2)}
.catrow:last-child{border:none}
.bar{height:4px;background:var(--rule-2);border-radius:2px;overflow:hidden;flex:1;max-width:80px}
.bar i{display:block;height:100%;background:var(--depth)}
.need{margin-top:9px;padding:9px 10px;border-radius:var(--r);background:var(--brass-bg);
  color:var(--brass);font-size:12.5px;line-height:1.4}
.need b{font-family:var(--mono);font-weight:700}

/* ---------- forms ---------- */
label.f{display:block;margin:0 0 10px}
label.f>span{display:block;margin-bottom:4px;font-family:var(--mono);font-size:10px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
input,select,textarea{width:100%;background:var(--chart);border:1px solid var(--rule);
  border-radius:var(--r);padding:9px 10px;font-size:15px}
textarea{min-height:120px;font-family:var(--mono);font-size:12.5px;line-height:1.5;resize:vertical}
input:focus,select,textarea:focus,button:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
select{outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--ink);background:var(--ink);color:var(--chart);
  border-radius:var(--r);padding:10px 14px;font-weight:700;font-size:13px;
  font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase}
.btn:active{opacity:.8}
.btn.ghost{background:none;color:var(--ink);border-color:var(--rule)}
.btn.sm{padding:6px 10px;font-size:11px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.danger{border-color:var(--shoal);color:var(--shoal);background:none}
.hint{font-size:12px;color:var(--ink-3);line-height:1.5;margin:6px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,14,22,.55);z-index:80;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:81;background:var(--card);
  border-top:1px solid var(--rule);border-radius:10px 10px 0 0;
  max-height:88vh;overflow-y:auto;transform:translateY(101%);visibility:hidden;
  transition:transform .22s cubic-bezier(.2,.8,.2,1),visibility .22s;
  padding:0 var(--pad) calc(20px + env(safe-area-inset-bottom));max-width:820px;margin:0 auto}
.sheet.on{transform:translateY(0);visibility:visible}
.sh-h{position:sticky;top:0;background:var(--card);display:flex;align-items:center;gap:10px;
  padding:14px 0 11px;border-bottom:1px solid var(--rule);margin-bottom:14px;z-index:2}

/* ---------- tabbar ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);
  border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-3)}
nav button span{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;font-weight:700}
nav button.on{color:var(--ink)}
nav button.on svg{stroke-width:2.2}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;transform:translate(-50%,14px);bottom:calc(76px + env(safe-area-inset-bottom));
  z-index:90;background:var(--ink);color:var(--chart);padding:9px 15px;border-radius:999px;
  font-size:13px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- desktop ---------- */
@media(min-width:900px){
  body{padding-bottom:0;display:grid;grid-template-columns:190px 1fr;min-height:100vh}
  header{grid-column:1/-1;position:sticky}
  nav{position:sticky;top:0;grid-column:1;grid-row:2;display:flex;flex-direction:column;
    align-self:start;border-top:none;border-right:1px solid var(--rule);background:none;padding:14px 10px;gap:2px}
  nav button{flex-direction:row;justify-content:flex-start;gap:10px;padding:9px 11px;border-radius:var(--r);width:100%}
  nav button span{font-size:11px}
  nav button.on{background:var(--card);color:var(--ink)}
  main{grid-column:2;grid-row:2;padding:20px 26px 60px}
  .sheet{border-radius:10px;bottom:auto;top:50%;left:50%;right:auto;width:560px;
    transform:translate(-50%,-46%) scale(.98);max-height:82vh;border:1px solid var(--rule)}
  .sheet.on{transform:translate(-50%,-50%) scale(1);visibility:visible}
  #toast{bottom:26px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <div class="wordmark"><b>Due</b><span>&#9650;</span><b>North</b></div>
    <div id="hstat"></div>
    <button class="hbtn" id="setupBtn" aria-label="Setup" title="Setup">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1 2 2 0 1 1-4 0 1.6 1.6 0 0 0-2.7-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 15a2 2 0 1 1 0-4 1.6 1.6 0 0 0 1.1-2.7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 9 4.6a2 2 0 1 1 4 0A1.6 1.6 0 0 0 15.7 5.7l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.6 1.6 0 0 0 19.4 11a2 2 0 1 1 0 4z"/></svg>
    </button>
    <button class="hbtn" id="syncBtn" aria-label="Sync everything" title="Sync everything">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/></svg>
    </button>
  </div>
  <div class="bearing" id="bearing"></div>
</header>

<main id="view"></main>

<nav id="tabs">
  <button data-tab="today" class="on"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="5"/></svg><span>Today</span></button>
  <button data-tab="chart"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><span>Chart</span></button>
  <button data-tab="grades"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Grades</span></button>
  <button data-tab="plan"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Plan</span></button>
  <button data-tab="log"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 21s-7-4.6-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.4-7 10-7 10z"/></svg><span>Hours</span></button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div id="toast"></div>

<script>
"use strict";
/* ==========================================================================
   DUE NORTH — offline-first academic deadline tracker
   Storage: localStorage only. Canvas + push/email go through your own
   Cloudflare Worker so a token is never held in the browser.
   ========================================================================== */

/* ---------------- state ---------------- */
const KEY = "duenorth.v1";
const TYPES = ["assignment","exam","quiz","lab","reading","project","other"];
const EST = {assignment:90, exam:240, quiz:60, lab:120, reading:45, project:300, other:60};
const PALETTE = ["#2F6DA3","#A03A22","#2A6360","#7A4E9C","#9C7C12","#396B2E","#A33C6B","#4A5B78"];

/* Settings that describe THIS device never sync — a laptop must not inherit
   the phone's "push is on", and each device needs its own worker credentials. */
const LOCAL_ONLY = ["workerUrl","appKey","push","lastSync","lastCloud","sync"];
function blank(){
  return {
    v:3, courses:[], items:[], blocks:[], activities:[], weekly:[], busy:[], settingsTs:0,
    settings:{
      workerUrl:"", appKey:"", email:"", leadDays:[7,3,1,0], digestHour:7,
      dailyCapMin:180, push:false, sync:true, lastSync:0, lastCloud:0, lastBusy:0,
      semStart:"", semEnd:"", target:90,
      wakeHour:9, sleepHour:22, sessionMin:30, bufferMin:10, restMin:45,
      term:"", priorCredits:0, priorGpa:0, priorBcpmCredits:0, priorBcpmGpa:0
    }
  };
}
/* AMCAS totals a separate Biology/Chemistry/Physics/Math GPA. This guesses
   from the subject prefix; it's a starting point you confirm per course, since
   AMCAS classifies by course content and its ruling is the one that counts. */
const BCPM_RE=/^(BIOSC|BIO|BCHEM|BIOENG|CHEM|PHYS|MATH|STAT|NROSCI|GEOL|ASTRO|EOH|MICR|BSC)/i;
function guessBcpm(code){ return BCPM_RE.test(String(code||"").trim()); }
function guessTerm(d){
  d=d||new Date(); const y=d.getFullYear(), m=d.getMonth();
  return (m>=7?"Fall "+y : m<=3?"Spring "+y : "Summer "+y);
}
function curTerm(){ return D.settings.term || guessTerm(); }
function terms(){
  const set=new Set(courseList().map(c=>c.term).filter(Boolean));
  set.add(curTerm());
  return [...set].sort((a,b)=>{
    const ord={Spring:0,Summer:1,Fall:2};
    const [sa,ya]=a.split(" "), [sb,yb]=b.split(" ");
    return (+yb-+ya) || (ord[sb]-ord[sa]);
  });
}
const nowTs = () => Date.now();
function touch(o){ o.ts = nowTs(); return o; }
function touchSettings(){ D.settingsTs = nowTs(); }
let D = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return blank();
    const d = JSON.parse(raw), b = blank();
    d.settings = Object.assign(b.settings, d.settings||{});
    for(const k of ["courses","items","blocks","activities","weekly","busy"])
      if(!Array.isArray(d[k])) d[k]=[];
    // v1 kept a parallel map of completed ids; fold it into the items themselves
    // so there is one source of truth for the merge to reason about.
    if(d.done && typeof d.done==="object"){
      for(const it of d.items) if(d.done[it.id]) it.done=true;
      delete d.done;
    }
    // pre-sync records get ts=1 so any real edit anywhere wins over them
    for(const k of ["courses","items","blocks","activities","weekly"])
      d[k].forEach(x=>{ if(!x.ts) x.ts=1; });
    if(!d.settingsTs) d.settingsTs=1;
    // v2 -> v3: courses gain a term and a BCPM flag
    for(const c of d.courses){
      if(!c.term) c.term=guessTerm();
      if(c.bcpm===undefined) c.bcpm=guessBcpm(c.code);
    }
    d.v=3;
    return d;
  }catch(e){ console.warn("load failed",e); return blank(); }
}
let saveT=null;
function save(push=true){
  try{ localStorage.setItem(KEY, JSON.stringify(D)); }
  catch(e){ toast("Storage full — export a backup"); }
  if(push){ clearTimeout(saveT); saveT=setTimeout(()=>cloudSync(true), 3000); }
}
const uid = () => Math.random().toString(36).slice(2,10);

/* ---------------- dates ---------------- */
const MS_D = 86400000;
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["S","M","T","W","T","F","S"];
const DOW3 = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function today0(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function dkey(d){
  d = (d instanceof Date) ? d : new Date(d);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function fromKey(k){ const [y,m,dd]=k.split("-").map(Number); return new Date(y,m-1,dd); }
function daysOut(iso){ return Math.round((fromKey(dkey(iso)) - today0())/MS_D); }
function fmtTime(iso){
  const d=new Date(iso);
  if(d.getHours()===0 && d.getMinutes()===0) return "";
  let h=d.getHours(), ap=h<12?"am":"pm"; h=h%12||12;
  const m=d.getMinutes();
  return h+(m?":"+String(m).padStart(2,"0"):"")+ap;
}
function fmtDue(iso){
  const d=new Date(iso), n=daysOut(iso), t=fmtTime(iso);
  let base;
  if(n===0) base="Today"; else if(n===1) base="Tomorrow"; else if(n===-1) base="Yesterday";
  else base = DOW3[d.getDay()]+" "+MON[d.getMonth()]+" "+d.getDate();
  return base + (t?" · "+t:"");
}
function cdown(iso){
  const n=daysOut(iso);
  if(n<0) return (-n)+"d late";
  if(n===0){
    const ms = new Date(iso)-Date.now();
    if(ms>0 && ms<MS_D){ const h=Math.floor(ms/3600000); return h>=1? h+"h left":"<1h"; }
    return "today";
  }
  return "in "+n+"d";
}
function urg(it){
  if(isDone(it)) return "done";
  const n=daysOut(it.due);
  return n<0 ? "od" : n<=2 ? "soon" : "";
}

/* ---------------- items ---------------- */
function isDone(it){ return !!it.done; }
function setDone(it,v){ it.done=!!v; touch(it); }
/* Deleted records stay as tombstones so other devices learn about the deletion;
   everything user-facing reads through these two helpers instead. */
function live(){ return D.items.filter(i=>!i.del); }
function courseList(){ return D.courses.filter(c=>!c.del); }
function activityList(){ return D.activities.filter(a=>!a.del); }
function weeklyList(){ return D.weekly.filter(w=>!w.del); }
function course(id){ return D.courses.find(c=>c.id===id&&!c.del) || {id:null,name:"No course",code:"—",color:"var(--ink-3)"}; }
function sorted(list){ return list.slice().sort((a,b)=> new Date(a.due)-new Date(b.due)); }
function open_(){ return live().filter(i=>!isDone(i)); }
function overdue(){ return sorted(open_().filter(i=>daysOut(i.due)<0)); }
function dueOn(k){ return sorted(live().filter(i=>dkey(i.due)===k)); }
function upcoming(days){
  return sorted(open_().filter(i=>{const n=daysOut(i.due); return n>=0 && n<=days;}));
}
function streak(){
  // consecutive days back from yesterday where nothing was left overdue at day's end
  let s=0;
  for(let k=1;k<=120;k++){
    const day = new Date(today0()-k*MS_D), key=dkey(day);
    const due = live().filter(i=>dkey(i.due)===key);
    if(due.length===0) continue;
    if(due.every(isDone)) s++; else break;
  }
  return s;
}

/* ---------------- schedule awareness ----------------
   Everything is minutes from local midnight. Busy time comes from your
   calendar feed (via the worker) plus any recurring commitments you type in;
   free time is the study window minus busy, minus a buffer either side.   */
function hm(min){
  min=Math.max(0,Math.min(1439,Math.round(min)));
  let h=Math.floor(min/60), m=min%60, ap=h<12?"am":"pm";
  h=h%12||12;
  return h+(m?":"+String(m).padStart(2,"0"):"")+ap;
}
function parseHM(str){
  const m=String(str||"").match(/^(\d{1,2}):(\d{2})$/);
  return m ? Math.min(1439,+m[1]*60+ +m[2]) : null;
}
function mergeIv(list){
  const a=list.filter(x=>x[1]>x[0]).sort((x,y)=>x[0]-y[0]), out=[];
  for(const iv of a){
    const last=out[out.length-1];
    if(last && iv[0]<=last[1]) last[1]=Math.max(last[1],iv[1]);
    else out.push([iv[0],iv[1]]);
  }
  return out;
}
function subtractIv(win, busy){
  let free=[[win[0],win[1]]];
  for(const b of busy){
    const next=[];
    for(const f of free){
      if(b[1]<=f[0]||b[0]>=f[1]){ next.push(f); continue; }
      if(b[0]>f[0]) next.push([f[0],b[0]]);
      if(b[1]<f[1]) next.push([b[1],f[1]]);
    }
    free=next;
  }
  return free.filter(f=>f[1]-f[0]>0);
}
/* commitments from the imported calendar, expanded into today-relative minutes */
function busyFor(k){
  const buf=D.settings.bufferMin||0, out=[];
  for(const e of (D.busy||[])){
    const st=new Date(e.s);
    if(dkey(st)!==k) continue;
    const a=st.getHours()*60+st.getMinutes();
    out.push([a-buf, a+(e.m||60)+buf]);
  }
  const dow=fromKey(k).getDay();
  for(const w of weeklyList()){
    if(!(w.days||[]).includes(dow)) continue;
    const a=parseHM(w.start); if(a==null) continue;
    out.push([a-buf, a+(w.min||60)+buf]);
  }
  return mergeIv(out);
}
function labelsFor(k){
  const out=[];
  for(const e of (D.busy||[])) if(dkey(new Date(e.s))===k){
    const st=new Date(e.s), a=st.getHours()*60+st.getMinutes();
    out.push({a, b:a+(e.m||60), t:e.t||"Busy"});
  }
  const dow=fromKey(k).getDay();
  for(const w of weeklyList()) if((w.days||[]).includes(dow)){
    const a=parseHM(w.start); if(a==null) continue;
    out.push({a, b:a+(w.min||60), t:w.title||"Commitment"});
  }
  return out.sort((x,y)=>x.a-y.a);
}
function studyWindow(){
  const w=(D.settings.wakeHour!=null?D.settings.wakeHour:7)*60;
  let s=(D.settings.sleepHour!=null?D.settings.sleepHour:23)*60;
  if(s<=w) s=1439;                      // guard against a window that wraps
  return [w,s];
}
function freeFor(k, extraBusy){
  return subtractIv(studyWindow(), mergeIv(busyFor(k).concat(extraBusy||[])));
}
function freeMinutes(k){ return freeFor(k).reduce((s,f)=>s+(f[1]-f[0]),0); }

/* ---------------- SIGNATURE: 14-day bearing strip ---------------- */
function renderBearing(){
  const host=$("#bearing");
  /* The viewBox is built to match the container's real pixel width, so nothing
     is scaled and the day labels stay unstretched at any screen size. */
  const N=14, H=54, W=Math.max(280, Math.round(host.clientWidth||340)), w=W/N;
  const t0=today0();
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" role="img" '+
        'aria-label="Deadlines over the next 14 days">';
  const mw=Math.min(10, w*0.52);
  for(let i=0;i<N;i++){
    const day=new Date(+t0+i*MS_D), k=dkey(day), x=i*w, cx=x+w/2;
    const items=live().filter(z=>dkey(z.due)===k), opn=items.filter(z=>!isDone(z));
    s+='<g class="bs-day" data-k="'+k+'">';
    s+='<rect x="'+x.toFixed(1)+'" y="0" width="'+w.toFixed(1)+'" height="'+H+'" fill="transparent"/>';
    if(day.getDay()===0||day.getDay()===6)
      s+='<rect class="bs-wk" x="'+x.toFixed(1)+'" y="0" width="'+w.toFixed(1)+'" height="34"/>';
    s+='<rect class="bs-lane" x="'+x.toFixed(1)+'" y="32" width="'+w.toFixed(1)+'" height="1.5"/>';
    let y=31;
    for(const it of opn.slice(0,3)){
      const h=(it.type==="exam"||it.type==="quiz")?13:(it.type==="project"?10:7);
      s+='<rect class="bs-mark" x="'+(cx-mw/2).toFixed(1)+'" y="'+(y-h)+'" width="'+mw.toFixed(1)+
         '" height="'+h+'" fill="'+(course(it.courseId).color||"var(--brass)")+'"/>';
      y-=h+2;
    }
    if(opn.length>3)
      s+='<text class="bs-lt" x="'+cx.toFixed(1)+'" y="8" text-anchor="middle" font-weight="700">+'+(opn.length-3)+'</text>';
    if(items.length && !opn.length)
      s+='<circle cx="'+cx.toFixed(1)+'" cy="27" r="2.5" fill="var(--depth)"/>';
    s+='<text class="bs-lt" x="'+cx.toFixed(1)+'" y="43" text-anchor="middle">'+DOW[day.getDay()]+'</text>';
    s+='<text class="bs-dt" x="'+cx.toFixed(1)+'" y="52" text-anchor="middle">'+day.getDate()+'</text>';
    if(k===selKey)
      s+='<path class="bs-sel" d="M'+(x+2)+' 30 v4 h'+(w-4).toFixed(1)+' v-4"/>';
    s+='</g>';
  }
  /* the needle is now, and it slides across today's column through the day */
  const nx=Math.min(W-1,(Date.now()-t0)/MS_D*w);
  s+='<path class="bs-needle" d="M'+nx.toFixed(1)+' 8 V33"/>'+
     '<path d="M'+(nx-4).toFixed(1)+' 8 h8 l-4 5 Z" fill="var(--ink)"/>';
  s+='</svg>';
  host.innerHTML=s;
  host.querySelectorAll(".bs-day").forEach(g=>g.onclick=()=>{
    selKey=g.dataset.k; calMonth=fromKey(selKey);
    if(tab!=="chart"){ tab="chart"; syncTabs(); }
    render();
  });
  const od=overdue().length, soon=upcoming(2).length;
  $("#hstat").innerHTML = od ? '<span class="pill bad">'+od+' late</span>'
    : soon ? '<span class="pill warn">'+soon+' due soon</span>'
    : open_().length ? '<span class="pill ok">clear</span>' : "";
}

/* ---------------- view: GRADES ---------------- */
const GPA_SCALE=[[93,"A",4],[90,"A-",3.75],[87,"B+",3.25],[83,"B",3],[80,"B-",2.75],
  [77,"C+",2.25],[73,"C",2],[70,"C-",1.75],[67,"D+",1.25],[63,"D",1],[60,"D-",.75],[0,"F",0]];
function letter(p){ for(const [c,l] of GPA_SCALE) if(p>=c) return l; return "F"; }
function points(p){ for(const [c,,g] of GPA_SCALE) if(p>=c) return g; return 0; }

function gradeOf(c){
  const cats=(c.cats||[]).map(cat=>{
    let sc=(cat.scores||[]).filter(s=>s.possible>0);
    const drop=Math.max(0,+cat.dropLowest||0);
    let dropped=0;
    if(drop>0 && sc.length>drop){
      // discard the weakest N by ratio, the way a syllabus means it
      sc=sc.slice().sort((a,b)=>(a.earned/a.possible)-(b.earned/b.possible)).slice(drop);
      dropped=drop;
    }
    const e=sc.reduce((s,x)=>s+(+x.earned||0),0), p=sc.reduce((s,x)=>s+(+x.possible||0),0);
    return {...cat, pct: p>0 ? e/p*100 : null, e, p, n:sc.length, dropped};
  });
  const scoredW=cats.filter(x=>x.pct!=null).reduce((s,x)=>s+(+x.weight||0),0);
  const earnedW=cats.filter(x=>x.pct!=null).reduce((s,x)=>s+(+x.weight||0)*x.pct/100,0);
  const totalW=cats.reduce((s,x)=>s+(+x.weight||0),0);
  const computed = scoredW>0 ? earnedW/scoredW*100 : null;
  return {cats, cur: (c.finalPct!=null?+c.finalPct:computed), computed,
          isFinal:c.finalPct!=null, scoredW, earnedW, totalW};
}
/* Assignments that arrived from your calendar and are waiting on a score.
   Nothing is invented in the gradebook — this is derived from your items, so
   there are never orphan rows to clean up. */
function pickCat(c, type){
  const pats={exam:/exam|midterm|final|test/i, quiz:/quiz/i, lab:/lab/i,
    project:/project|present/i, assignment:/homework|hw|problem set|assign|pset/i,
    other:/other|misc/i};
  const re=pats[type];
  const cats=c.cats||[];
  return (re && cats.find(x=>re.test(x.name))) || cats[0] || null;
}
function pendingFor(c){
  const scored=new Set();
  for(const cat of (c.cats||[])) for(const sc of (cat.scores||[])) if(sc.itemId) scored.add(sc.itemId);
  return sorted(live().filter(i=>i.courseId===c.id && !scored.has(i.id)
    && i.type!=="reading" && (isDone(i)||daysOut(i.due)<0)));
}
function vGrades(){
  if(!courseList().length) return '<div class="empty" style="padding:30px">'+
    '<p style="margin:0 0 12px;color:var(--ink-2)">No courses yet. Sync your calendar or add one.</p>'+
    '<button class="btn" onclick="editCourse()">+ Add course</button></div>';
  const term=gradeView.term||curTerm();
  const inTerm=courseList().filter(c=>(c.term||curTerm())===term);
  let h="";

  /* --- GPA panel: term, cumulative, and the separate BCPM figure --- */
  const roll=(list)=>{
    let pts=0, cr=0;
    for(const c of list){ const g=gradeOf(c);
      if(g.cur!=null && c.credits){ pts+=points(g.cur)*c.credits; cr+=c.credits; } }
    return {pts,cr};
  };
  const S=D.settings;
  const tg=roll(inTerm);
  const all=roll(courseList());
  const bc=roll(courseList().filter(c=>c.bcpm));
  const cumPts=all.pts+(+S.priorGpa||0)*(+S.priorCredits||0), cumCr=all.cr+(+S.priorCredits||0);

      '<div class="lbl" style="letter-spacing:.06em">'+esc(c.name!==c.code?c.name:"")+(c.credits?" · "+c.credits+" cr":"")+
        (g.isFinal?" · final":"")+'</div></div>'+
      '<div style="text-align:right">'+
        (g.cur!=null?'<div class="gbig">'+g.cur.toFixed(1)+'<span style="font-size:13px">%</span></div><div class="gltr">'+letter(g.cur)+'</div>'

      '</div>'+
      (pend.length?'<span class="pill warn" style="align-self:flex-start">'+pend.length+'</span>':'')+
      '<button class="hbtn" data-gopen="'+c.id+'" aria-label="Show details"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button></div>';
    if(c._open){
      h+='<div class="gbody">';
      if(pend.length){
        h+='<div class="lbl" style="margin-bottom:5px">Waiting on a score</div>';
        for(const it of pend.slice(0,8))
          h+='<div class="catrow"><div class="grow" style="min-width:0">'+
            '<div style="font-size:13px;font-weight:600">'+esc(it.title)+'</div>'+

        if(pend.length>8) h+='<p class="hint" style="margin:4px 0 0">+'+(pend.length-8)+' more</p>';
        h+='<div style="height:12px"></div>';
      }
      if(!g.cats.length) h+='<p class="hint" style="margin:0 0 8px">No categories yet. '+
        '<button class="btn ghost sm" data-std="'+c.id+'">Add a standard set</button></p>';
      for(const cat of g.cats){

          '<div style="font-size:13px;font-weight:600">'+esc(cat.name)+'</div>'+
          '<div class="lbl" style="letter-spacing:.06em">'+(+cat.weight||0)+'% · '+cat.n+' score'+(cat.n===1?"":"s")+
            (drop?" · drops "+drop:"")+'</div></div>'+
          (cat.pct!=null?'<div class="bar"><i style="width:'+Math.min(100,cat.pct)+'%"></i></div>'+

          const best=(g.earnedW+rem)/g.totalW*100;
          h+='<div class="need">'+(need>100
            ? 'A <b>'+tgt+'%</b> is out of reach. Perfect scores on the remaining <b>'+rem.toFixed(0)+
              '%</b> would finish at <b>'+best.toFixed(1)+'% ('+letter(best)+')</b>.'
            : 'To finish at <b>'+tgt+'%</b> you need an average of <b>'+
              (need<=0?"anything — already locked in":need.toFixed(1)+"%")+
              '</b> on the remaining <b>'+rem.toFixed(0)+'%</b> of the grade.')+'</div>';
        } else if(g.cur!=null){
          h+='<div class="need">All weighted work is scored. Final: <b>'+g.cur.toFixed(1)+'% ('+letter(g.cur)+')</b>.</div>';
        }
        if(Math.abs(g.totalW-100)>0.5)
          h+='<p class="hint">Weights add to '+g.totalW.toFixed(0)+'%, not 100%. Grades are scaled to what you entered.</p>';
      }

        '<button class="btn ghost sm" data-addcat="'+c.id+'">+ Category</button>'+
        '<button class="btn ghost sm" data-target="'+c.id+'">Target: '+tgt+'%</button>'+
        '<div class="grow"></div><button class="btn ghost sm" data-cedit="'+c.id+'">Course</button></div>';
      h+='</div>';
    }
    h+='</div>';
  }
  h+='</section>';
  h+='<button class="btn ghost wide" onclick="editCourse()">+ Add course</button>';
  return h;

/* ---------------- view: PLAN (time-aware backwards planner) ----------------
   Sessions are laid backwards from each due date, then placed into actual gaps
   in your week: never during a class, a lab, a shift or sleep, never over the
   daily ceiling, and never on top of a session already placed.            */
const SPREAD={exam:[10,7,5,3,2,1],quiz:[3,2,1],project:[14,10,7,5,3,2,1],lab:[3,1],
  assignment:[3,1],reading:[1],other:[1]};
function buildPlan(push=true){
  const cap=D.settings.dailyCapMin||180;
  const minS=D.settings.sessionMin||30;
  const keep=D.blocks.filter(b=>b.done||b.del);   // never blow away finished work
  const rest=D.settings.restMin!=null?D.settings.restMin:45;
  const used={}, taken={};
  for(const b of keep){
    used[b.date]=(used[b.date]||0)+b.min;
    // reserve a rest gap either side, so sessions spread across the day
    // instead of stacking end-to-end from the moment you get up
    if(b.start!=null) (taken[b.date]=taken[b.date]||[]).push([b.start-rest,b.start+b.min+rest]);
  }
  const fresh=[];
  for(const it of sorted(open_())){
    const n=daysOut(it.due); if(n<0) continue;
    const total=it.est||EST[it.type]||60;
    const offs=(SPREAD[it.type]||SPREAD.other).filter(o=>o<=n);
    const use=offs.length?offs:[0];
    const per=Math.max(minS, Math.round(total/use.length/5)*5);
    for(const o of use){
      const k=dkey(new Date(+fromKey(dkey(it.due))-o*MS_D));
      if(daysOut(k+"T12:00:00")<0) continue;
      if((used[k]||0)+per>cap) continue;                 // daily ceiling
      const id=it.id+":"+k;
      if(keep.some(x=>x.id===id)) continue;
      // roomiest gap first, so a long session isn't wedged into a short slot
      const gaps=freeFor(k, taken[k]||[]).filter(g=>g[1]-g[0]>=per)
        .sort((a,b)=>(b[1]-b[0])-(a[1]-a[0]));
      if(!gaps.length) continue;                         // genuinely no room
      const start=gaps[0][0];
      used[k]=(used[k]||0)+per;
      (taken[k]=taken[k]||[]).push([start-rest,start+per+rest]);
      fresh.push({id,itemId:it.id,date:k,start,min:per,done:false,ts:1});
    }
  }
  D.blocks=keep.concat(fresh); save(push);
}
function loadMin(k){
  return D.blocks.filter(b=>b.date===k&&!b.del).reduce((s,b)=>s+b.min,0);
}
function unplaced(){
  // items whose sessions couldn't all be fitted, so you know before it bites
  const out=[];
  for(const it of open_()){
    if(daysOut(it.due)<0) continue;
    const want=(SPREAD[it.type]||SPREAD.other).filter(o=>o<=daysOut(it.due)).length||1;
    const got=D.blocks.filter(b=>b.itemId===it.id&&!b.del).length;
    if(got<want) out.push({it, got, want});
  }
  return out;
}

function vPlan(){
  const cap=D.settings.dailyCapMin||180, win=studyWindow();
  const start=today0();
  let h='<div class="card row" style="margin-bottom:14px"><div class="grow">'+
    '<div class="lbl">Study blocks</div><div class="hint" style="margin:2px 0 0">'+
    'Placed around your calendar · '+hm(win[0])+'–'+hm(win[1])+' · max '+cap+' min/day</div></div>'+
    '<button class="btn sm" id="rebuild">Rebuild</button></div>';
  if(!(D.busy||[]).length && !weeklyList().length)
    h+='<div class="empty" style="margin-bottom:14px">Due North doesn\'t know your schedule yet, so blocks are placed from '+
       hm(win[0])+' onward. Add your calendar feed or weekly classes in Setup.</div>';
  const miss=unplaced();
  if(miss.length) h+='<div class="need" style="margin-bottom:14px">No room for '+
    miss.length+' session'+(miss.length===1?"":"s")+' — your week is full. Raise the daily ceiling, '+
    'widen your awake hours, or accept a lighter plan.</div>';

  // free-time summary for the week ahead
  let wk=0; const days=[], minS=D.settings.sessionMin||30;
  for(let i=0;i<7;i++){
    const k=dkey(new Date(+start+i*MS_D));
    const all=freeFor(k, D.blocks.filter(b=>b.date===k&&!b.del&&b.start!=null).map(b=>[b.start,b.start+b.min]));
    const f=all.filter(g=>g[1]-g[0]>=minS);        // slivers aren't study time
    const m=f.reduce((s,g)=>s+(g[1]-g[0]),0);
    wk+=m; days.push({k,f,m,frag:all.length-f.length});
  }
  h+='<section class="sec"><div class="sec-h"><h2>Free time this week</h2><div class="line"></div>'+
     '<span class="num lbl" style="font-size:10px">'+Math.round(wk/60)+'h usable</span></div><div class="card">';
  for(const d of days){
    const dt=fromKey(d.k);
    h+='<div class="catrow"><div style="width:34px" class="lbl">'+DOW3[dt.getDay()].toUpperCase()+'</div>'+
      '<div class="grow" style="font-size:12px;font-family:var(--mono);color:var(--ink-2)">'+

        :'<span class="muted">nothing '+(d.frag?"usable":"open")+'</span>')+'</div>'+
      '<div class="num" style="font-size:12px;font-weight:700">'+Math.round(d.m/60*10)/10+'h</div></div>';
  }
  h+='</div></section>';
  h+='<p class="hint" style="margin:-12px 0 18px">Gaps shorter than '+minS+
     ' minutes are left out — set a shorter session in Setup if you want them counted.</p>';

  let any=false;
  for(let i=0;i<14;i++){
    const d=new Date(+start+i*MS_D), k=dkey(d);
    const bl=D.blocks.filter(b=>b.date===k&&!b.del).sort((a,b)=>(a.start??0)-(b.start??0));
    const dues=dueOn(k).filter(x=>!isDone(x));
    const busy=labelsFor(k);
    if(!bl.length&&!dues.length) continue;
    any=true;
    const tot=bl.reduce((s,b)=>s+b.min,0), dn=bl.filter(b=>b.done).reduce((s,b)=>s+b.min,0);
    h+='<section class="sec" style="margin-bottom:14px"><div class="sec-h">'+
      '<h2>'+(i===0?"Today":i===1?"Tomorrow":DOW3[d.getDay()]+" "+MON[d.getMonth()]+" "+d.getDate())+'</h2>'+
      '<div class="line"></div>'+
      (tot?'<span class="num lbl" style="font-size:10px">'+dn+'/'+tot+' min</span>':'')+'</div>';
    if(tot) h+='<div class="bar" style="max-width:none;margin-bottom:8px"><i style="width:'+(tot?dn/tot*100:0)+'%"></i></div>';
    if(busy.length) h+='<div class="hint" style="margin:0 0 8px">Booked: '+
      busy.map(b=>esc(b.t)+' '+hm(b.a)).join(" · ")+'</div>';
    h+='<div class="stack">';
    for(const it of dues) h+='<div class="item od" style="border-left-color:var(--shoal)">'+
      '<div class="grow"><div class="it-t" style="font-size:13.5px">DUE — '+esc(it.title)+'</div>'+
      '<div class="it-m"><span class="it-c" style="color:'+course(it.courseId).color+'">'+esc(course(it.courseId).code)+'</span>'+
      '<span class="it-d">'+(fmtTime(it.due)||"end of day")+'</span></div></div></div>';
    for(const b of bl){
      const it=D.items.find(x=>x.id===b.itemId); if(!it) continue;
      h+='<div class="item'+(b.done?" done":"")+'" data-bid="'+b.id+'">'+
        '<button class="chk" data-bt="'+b.id+'" aria-label="Mark block done"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg></button>'+
        '<div class="grow"><div class="it-t" style="font-size:13.5px">'+esc(it.title)+'</div>'+
        '<div class="it-m">'+(b.start!=null?'<span class="it-c" style="color:var(--brass)">'+hm(b.start)+'–'+hm(b.start+b.min)+'</span>':'')+
        '<span class="it-c" style="color:'+course(it.courseId).color+'">'+esc(course(it.courseId).code)+'</span>'+
        '<span class="it-d">due '+fmtDue(it.due)+'</span></div></div>'+
        '<div class="cdown num">'+b.min+'m</div></div>';
    }
    h+='</div></section>';
  }
  if(!any) h+='<div class="empty">Nothing scheduled in the next two weeks.</div>';
  return h;
}
function bindPlan(root){
  const rb=root.querySelector("#rebuild");
  if(rb) rb.onclick=async()=>{ await refreshBusy(true); buildPlan(); render(); toast("Plan rebuilt"); };
  root.querySelectorAll("[data-bt]").forEach(b=>b.onclick=()=>{
    const bl=D.blocks.find(x=>x.id===b.dataset.bt); bl.done=!bl.done; touch(bl); save(); render();

/* ---------------- worker bridge ---------------- */
function W(){ return (D.settings.workerUrl||"").replace(/\/+$/,""); }
async function api(path, opts){
  if(!W()) throw new Error("No worker URL set — see Setup.");
  const r = await fetch(W()+path, Object.assign({
    headers:{ "X-App-Key": D.settings.appKey||"", "Content-Type":"application/json" }
  }, opts||{}));
  if(r.status===401) throw new Error("Worker rejected the app key.");
  if(!r.ok) throw new Error("Worker error "+r.status+" "+(await r.text()).slice(0,120));
  return r.json();
}
/* ---------------- cross-device sync ----------------
   One round trip does both directions: send what this device knows, the worker
   merges it with what the other device sent, and we adopt the result. Because
   the merge is per-entity and deletions leave tombstones, "marked the problem
   set done on my phone" and "entered exam scores on my laptop" both survive.
   Safe to call repeatedly, and a failure just leaves you on local data.      */
function syncableSettings(){
  const o={};
  for(const k in D.settings) if(!LOCAL_ONLY.includes(k)) o[k]=D.settings[k];
  o.tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
  return o;
}
function adoptMerged(m){
  if(!m||!Array.isArray(m.items)||!Array.isArray(m.courses)) return false;
  const openCard = new Set(D.courses.filter(c=>c._open).map(c=>c.id));
  D.courses = m.courses.map(c=> openCard.has(c.id) ? {...c,_open:true} : c);
  D.items   = m.items;
  if(Array.isArray(m.activities)) D.activities = m.activities;
  if(Array.isArray(m.weekly))     D.weekly     = m.weekly;
  // the worker only keeps completed blocks; this device re-derives the rest
  const ids=new Set((m.blocks||[]).map(b=>b.id));
  D.blocks=(m.blocks||[]).concat(D.blocks.filter(b=>!b.done&&!b.del&&!ids.has(b.id)));
  if((m.settingsTs||0) > (D.settingsTs||0)){
    for(const k in (m.settings||{})) if(!LOCAL_ONLY.includes(k)) D.settings[k]=m.settings[k];
    D.settingsTs=m.settingsTs;
  }
  buildPlan(false);
  return true;
}
async function cloudSync(quiet){
  if(!W() || D.settings.sync===false) return false;
  try{
    const m = await api("/sync",{method:"POST",body:JSON.stringify({
      courses:D.courses, items:D.items,
      blocks:D.blocks.filter(b=>b.done||b.del),
      activities:D.activities, weekly:D.weekly,
      settings:syncableSettings(), settingsTs:D.settingsTs||0
    })});
    adoptMerged(m);
    D.settings.lastCloud=Date.now();
    save(false);
    if(!quiet){ render(); toast("Devices in sync · "+live().length+" items"); }
    return true;
  }catch(e){ if(!quiet) toast(e.message.slice(0,90)); return false; }
}
/* Typing a 32-character key on a phone keyboard is miserable, so the laptop can
   hand its credentials over as a one-time link. The key is in the fragment, so
   it never reaches a server — but it IS a password, so it's shown once and the
   app strips it from the address bar the moment it's used. */
function pairLink(){
  if(!W()) return null;
  return location.origin+location.pathname+"#s="+
    btoa(JSON.stringify({u:W(), k:D.settings.appKey||""}));
}
function pairSheet(){
  const link=pairLink();
  if(!link) return toast("Fill in the worker URL and app key first");
  openSheet("Set up your other device",

    'and it will fill in the worker URL and app key, then pull everything down. '+
    'Send it to yourself however you like — it contains your app key, so treat it '+
    'like a password and don\'t post it anywhere public.</p>'+
    '<label class="f"><span>Pairing link</span><textarea id="p_l" readonly style="min-height:96px">'+esc(link)+'</textarea></label>'+
    '<div class="row"><button class="btn grow" id="p_c">Copy link</button>'+
    '<button class="btn ghost" id="p_m">Email it</button></div>');
  $("#p_c").onclick=async()=>{

    catch(e){ $("#p_l").select&&$("#p_l").select(); toast("Select the text and copy it"); }
  };
  $("#p_m").onclick=()=>{

}
async function syncEverything(){
  const btn=$("#syncBtn"); btn.classList.add("spin");
  try{
    await cloudSync(true);                 // pull anything the other device did
    if(W()) await syncCanvas(true);        // then refresh from Canvas
    await refreshBusy(true);               // and your calendar's busy time
    buildPlan(false);
    await cloudSync(true);                 // publish the result
    render();

/* ---------------- calendar: busy time ---------------- */
async function refreshBusy(force){
  if(!W()) return false;
  if(!force && Date.now()-(D.settings.lastBusy||0) < 30*60000) return false;
  try{
    const r=await api("/busy");
    if(r.unset) return false;
    D.busy=(r.events||[]).slice(0,1500);
    D.settings.lastBusy=Date.now(); save(false);
    return true;
  }catch(e){ console.warn("busy",e); return false; }
}

/* ---------------- Canvas sync ---------------- */
async function syncCanvas(quiet){
  const btn=$("#syncBtn"); if(!quiet) btn.classList.add("spin");
  try{
    const data = await api("/canvas/sync");
    let nc=0, ni=0, up=0;
    for(const rc of (data.courses||[])){
      let c = D.courses.find(x=>x.canvasId===rc.id);   // includes tombstones
      if(c&&c.del) continue;                            // you deleted it; stay deleted
      if(!c){
        c={id:uid(),canvasId:rc.id,code:rc.code||rc.name,name:rc.name,
           color:PALETTE[courseList().length%PALETTE.length],cats:[],credits:null};
        D.courses.push(touch(c)); nc++;
      } else { c.name=rc.name; if(!c.code) c.code=rc.code; touch(c); }
      c.canvasScore = rc.score;
      // merge Canvas assignment-group weights without clobbering hand-entered scores
      for(const g of (rc.groups||[])){
        let cat=(c.cats||[]).find(x=>x.canvasId===g.id);
        if(!cat && g.weight>0){ c.cats=c.cats||[]; cat={id:uid(),canvasId:g.id,name:g.name,weight:g.weight,scores:[]}; c.cats.push(cat); }
        else if(cat) cat.weight=g.weight;
      }
    }
    for(const ri of (data.items||[])){
      if(!ri.due) continue;
      const c = D.courses.find(x=>x.canvasId===ri.courseId);
      let it = D.items.find(x=>x.canvasId===ri.id);
      if(it&&it.del) continue;                          // respect a local deletion
      if(!it){
        D.items.push(touch({id:uid(),canvasId:ri.id,title:ri.title,courseId:c?c.id:null,
          type:ri.type||"assignment",due:ri.due,points:ri.points,est:0,notes:"",
          done:!!ri.submitted}));
        ni++;
      }else{
        const changed = it.title!==ri.title||it.due!==ri.due||!!ri.submitted!==!!it.done;
        if(it.title!==ri.title||it.due!==ri.due) up++;
        it.title=ri.title; it.due=ri.due; it.points=ri.points;
        if(c) it.courseId=c.id;
        if(ri.submitted) it.done=true;       // Canvas is the authority on submission
        if(changed) touch(it);
      }
    }
    D.settings.lastSync=Date.now(); buildPlan(false); save(false);
    if(!quiet){ render(); toast("Synced · "+ni+" new, "+up+" updated"+(nc?", "+nc+" course"+(nc>1?"s":""):"")); }
  }catch(e){ if(!quiet) toast(e.message.slice(0,80)); else console.warn(e); }
  finally{ if(!quiet) btn.classList.remove("spin"); }
}

/* ---------------- syllabus parser ---------------- */
const M_ABBR={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
/* order matters: "Final Project" is a project, "Lab 3 report" is a lab,
   "Final paper" is an assignment, and only a bare/explicit final is an exam */
const KEY_TYPE=[
  [/\b(project|presentation|poster|portfolio)\b/i,"project"],
  [/\bquiz(zes)?\b/i,"quiz"],
  [/\blab\b/i,"lab"],
  [/\b(final\s+exam|midterm|exam|test)\b/i,"exam"],
  [/\b(paper|essay|report|thesis|memo)\b/i,"assignment"],
  [/\b(read(ing)?s?|chapter|ch\.|pp?\.)\b/i,"reading"],
  [/\b(hw|homework|problem set|pset|assignment|due)\b/i,"assignment"],
  [/\bfinal\b/i,"exam"]];
function inferYear(mo,da){
  // A syllabus you paste is for the term you're in or about to start, so lean
  // forward: allow only ~6 weeks of hindsight before rolling to the next year.
  const now=new Date(), out=[];
  for(const y of [now.getFullYear()-1,now.getFullYear(),now.getFullYear()+1]){
    const d=new Date(y,mo,da), off=(d-today0())/MS_D;
    if(off>=-45&&off<=330) out.push([Math.abs(off),y]);
  }
  out.sort((a,b)=>a[0]-b[0]);
  return out.length?out[0][1]:now.getFullYear();
}
function grabDate(line){
  const hits=[];
  const re1=/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?(?:\s*,?\s*(\d{4}))?/gi;
  const re2=/\b(\d{1,2})\s*\/\s*(\d{1,2})(?:\s*\/\s*(\d{2,4}))?\b/g;
  const re3=/\b(\d{4})-(\d{1,2})-(\d{1,2})\b/g;
  let m;
  while((m=re3.exec(line))) hits.push({i:m.index,len:m[0].length,y:+m[1],mo:+m[2]-1,d:+m[3],ex:true});
  while((m=re1.exec(line))){
    const mo=M_ABBR[m[1].slice(0,3).toLowerCase()];
    hits.push({i:m.index,len:m[0].length,y:m[3]?+m[3]:inferYear(mo,+m[2]),mo,d:+m[2],ex:!!m[3]});
  }
  while((m=re2.exec(line))){
    const mo=+m[1]-1, d=+m[2];
    if(mo<0||mo>11||d<1||d>31) continue;
    let y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):inferYear(mo,d);
    hits.push({i:m.index,len:m[0].length,y,mo,d,ex:!!m[3]});
  }
  if(!hits.length) return null;
  hits.sort((a,b)=>a.i-b.i);
  const pick = /\bdue\b/i.test(line) ? hits[hits.length-1] : hits[0];
  let h=23,mi=59;
  const t=line.match(/\b(\d{1,2})(?::(\d{2}))?\s*([ap])\.?m\.?/i);
  if(t){ h=+t[1]%12; if(t[3].toLowerCase()==="p") h+=12; mi=t[2]?+t[2]:0; }
  else { const t2=line.match(/\b(\d{1,2}):(\d{2})\b/); if(t2&&+t2[1]<24){ h=+t2[1]; mi=+t2[2]; } }
  const dt=new Date(pick.y,pick.mo,pick.d,h,mi);
  if(isNaN(dt)) return null;
  return {dt, hits, ex:!!pick.ex};
}
function parseSyllabus(text){
  const items=[], cats=[];
  for(let raw of text.split(/\r?\n/)){
    let line=raw.replace(/\t+/g," | ").trim();
    if(line.length<4||line.length>260) { }
    // grading weights: "Homework  20%"  /  "Exams: 30 %"
    const cm=line.match(/^[\s|•\-*\u2022]*([A-Za-z][A-Za-z0-9 &\/'()+.\-]{1,44}?)\s*[:|\-–—]?\s*(\d{1,3}(?:\.\d+)?)\s*%\s*$/);
    if(cm && +cm[2]>0 && +cm[2]<=100){ cats.push({name:cm[1].trim(),weight:parseFloat(cm[2])}); continue; }
    if(line.length<4) continue;
    const g=grabDate(line); if(!g) continue;
    // strip every date token so the leftover reads like a title
    let title=line;
    g.hits.slice().sort((a,b)=>b.i-a.i).forEach(h=>{ title=title.slice(0,h.i)+" "+title.slice(h.i+h.len); });
    title=title.replace(/\b\d{1,2}(:\d{2})?\s*[ap]\.?m\.?\b/gi," ");
    // schedule tables: keep the cells that actually name work, drop week/date columns
    if(title.includes("|")){
      const STRONG=/\b(due|hw|homework|problem set|pset|assignment|exam|midterm|final|quiz|lab|project|paper|essay|report|presentation|read|chapter)\b/i;
      let cells=title.split("|").map(c=>c.trim())
        .filter(c=>c && !/^(week\s*\d+|wk\s*\d+|\d+|unit\s*\d+|[-–—.]+)$/i.test(c));
      const strong=cells.filter(c=>STRONG.test(c));
      title=(strong.length?strong:cells).join(" — ");
    }
    title=title.replace(/\b(due|by)\b/gi," ")
               .replace(/^[\s|•\-*\u2022#.,:;]+/,"").replace(/[\s|\-–—.,:;]+$/,"")
               .replace(/^(week|wk|unit)\s*\d+\s*[-–—:]?\s*/i,"")
               .replace(/\s{2,}/g," ").trim();
    if(title.length<3) continue;
    if(title.length>110) title=title.slice(0,108)+"…";
    let type="assignment";
    for(const [re,t] of KEY_TYPE) if(re.test(line)){ type=t; break; }
    const strong=/\b(due|hw|homework|problem set|pset|assignment|exam|midterm|final|quiz|lab|project|paper|essay|report|presentation|read|chapter)\b/i.test(line);
    items.push({title,type,due:g.dt.toISOString(),pick:strong,ex:g.ex});
  }
  /* Schedule tables run in order. If a line whose year we guessed lands before
     the line above it, the guess rolled off the end of the year — bump it. This
     is what keeps a spring syllabus pasted in August from splitting across two
     calendar years. */
  let prev=null;
  for(const x of items){
    if(prev && !x.ex){
      let d=new Date(x.due);
      for(let k=0;k<2 && d<prev;k++){ d=new Date(d.getFullYear()+1,d.getMonth(),d.getDate(),d.getHours(),d.getMinutes()); }
      x.due=d.toISOString();
    }
    prev=new Date(x.due);
  }
  const seen=new Set();
  return {items:items.filter(x=>{const k=x.title.toLowerCase()+dkey(x.due); if(seen.has(k))return false; seen.add(k); return true;}), cats};
}

    '<label class="f"><span>Course these belong to</span><select id="y_c">'+

/* ---------------- push ---------------- */
let swReg=null;
let pushState={checked:false};
function installed(){
  try{ return matchMedia("(display-mode: standalone)").matches || navigator.standalone===true; }
  catch(e){ return false; }
}
async function checkPush(){
  const st={checked:true, standalone:installed(),
    perm:("Notification" in window)?Notification.permission:"unsupported",
    swOK:false, sub:false, host:null};
  try{
    const reg = swReg || (navigator.serviceWorker && await navigator.serviceWorker.getRegistration());
    st.swOK=!!reg;
    if(reg){
      const sub=await reg.pushManager.getSubscription();
      st.sub=!!sub;
      if(sub) st.host=(()=>{ try{ return new URL(sub.endpoint).host; }catch(e){ return null; } })();
    }
  }catch(e){ st.err=String(e.message||e).slice(0,80); }
  pushState=st;
  // reconcile the stored flag with what the browser actually has
  if(!!D.settings.push !== st.sub){ D.settings.push=st.sub; save(false); }
  return st;
}
async function registerSW(){
  if(!("serviceWorker" in navigator)) return null;
  try{ swReg = await navigator.serviceWorker.register("sw.js"); return swReg; }
  catch(e){ return null; }
}
async function tellSW(){
  // the service worker fetches reminder text itself, so it needs the endpoint
  try{
    const c=await caches.open("dn-cfg");
    await c.put("/__cfg", new Response(JSON.stringify({url:W(),key:D.settings.appKey||""}),
      {headers:{"Content-Type":"application/json"}}));
  }catch(e){}
}
function b64url(s){
  const p="=".repeat((4-s.length%4)%4), b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));
  return Uint8Array.from(b, c=>c.charCodeAt(0));
}
async function enablePush(){
  if(!("Notification" in window)) return toast("This browser has no notifications");
  if(!W()) return toast("Set your worker URL first");
  const reg = swReg || await registerSW();
  if(!reg) return toast("Service worker failed — must be served over https");
  const perm = await Notification.requestPermission();
  if(perm==="denied") return toast("This site is blocked from sending notifications — clear it in Chrome's site settings");
  if(perm!=="granted") return toast("Permission not granted — tap Turn on push again and choose Allow");
  try{
    const {key} = await api("/push/key");
    if(!key) return toast("Worker has no VAPID_PUBLIC set");
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64url(key)});
    await api("/push/subscribe",{method:"POST",body:JSON.stringify({sub:sub.toJSON(),
      tz:Intl.DateTimeFormat().resolvedOptions().timeZone})});
    await tellSW(); await cloudSync(true);
    D.settings.push=true; save(); await checkPush(); render();
    toast("Push on for this device"+(installed()?"":" — but you're in a browser tab, install to the home screen"));
  }catch(e){ toast("Subscribe failed: "+String(e.message||e).slice(0,80)); }
}
/* Drops any existing subscription and makes a fresh one. Fixes a device that
   thinks it is registered but isn't, or one holding a stale subscription. */
async function reRegisterPush(){
  try{
    const reg = swReg || await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    if(sub){
      await api("/push/unsubscribe",{method:"POST",body:JSON.stringify({endpoint:sub.endpoint})}).catch(()=>{});
      await sub.unsubscribe();
    }
    D.settings.push=false; save(false);
  }catch(e){}
  await enablePush();
}
async function disablePush(){
  try{
    const reg=swReg||await navigator.serviceWorker.getRegistration();
    const sub=reg&&await reg.pushManager.getSubscription();
    if(sub){ await api("/push/unsubscribe",{method:"POST",body:JSON.stringify({endpoint:sub.endpoint})}).catch(()=>{}); await sub.unsubscribe(); }
  }catch(e){}
  D.settings.push=false; save(); await checkPush(); render(); toast("Push off for this device");
}

/* ---------------- calendar export ---------------- */
function exportICS(){
  const pad=n=>String(n).padStart(2,"0");
  const z=d=>d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+"T"+pad(d.getUTCHours())+pad(d.getUTCMinutes())+"00Z";
  let s=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Due North//EN","CALSCALE:GREGORIAN","X-WR-CALNAME:Due North"];
  for(const it of live()){
    const d=new Date(it.due), end=new Date(+d+1800000), c=course(it.courseId);
    s.push("BEGIN:VEVENT","UID:dn-"+it.id+"@duenorth","DTSTAMP:"+z(new Date()),
      "DTSTART:"+z(d),"DTEND:"+z(end),
      "SUMMARY:"+((c.code&&c.code!=="—")?c.code+" — ":"")+it.title.replace(/([,;\\])/g,"\\$1"),
      "DESCRIPTION:"+(it.type||"item")+(it.points!=null?" · "+it.points+" pts":"")+(isDone(it)?" · done":""),
      "CATEGORIES:"+(c.code||"Due North"));
    if(!isDone(it)) for(const ld of (D.settings.leadDays||[1])){
      s.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+it.title,
        "TRIGGER:-PT"+(ld*24)+"H","END:VALARM");
    }
    s.push("END:VEVENT");
  }
  s.push("END:VCALENDAR");
  dl("due-north.ics", s.join("\r\n"), "text/calendar");
}
function dl(name, text, mime){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:mime||"application/json"}));
  a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

/* ---------------- view: LOG (experience hours) ----------------
   Med school applications itemise every activity with hour counts, dates and a
   contact. Reconstructing that in your third year from memory is miserable, so
   this exists to be filled in as you go. Categories and the 700-character
   description limit mirror how AMCAS asks for it; verify against the current
   application, since the details do shift year to year.                   */
const ACT_CATS=["Clinical volunteering","Non-clinical volunteering","Physician shadowing",
  "Research / lab","Paid employment","Leadership","Teaching / tutoring",
  "Extracurricular / hobby","Honour or award","Publication","Other"];
const ACT_DESC_MAX=700, ACT_MEANING_MAX=1325;

function actHours(a){ return (a.entries||[]).reduce((s,e)=>s+(+e.hours||0),0); }
function shortDate(k){
  if(!k) return "";
  const d=fromKey(k);
  return isNaN(d) ? k : MON[d.getMonth()]+" "+d.getDate()+
    (d.getFullYear()!==new Date().getFullYear()?" "+d.getFullYear():"");
}
function totalHours(){ return activityList().reduce((s,a)=>s+actHours(a),0); }
function hoursByCat(){
  const m={};
  for(const a of activityList()) m[a.category||"Other"]=(m[a.category||"Other"]||0)+actHours(a);
  return Object.entries(m).sort((x,y)=>y[1]-x[1]);
}
function vLog(){
  const list=activityList().slice().sort((a,b)=>actHours(b)-actHours(a));
  let h="";
  if(!list.length) return '<div class="empty" style="padding:32px 18px">'+
    '<div class="lbl" style="margin-bottom:8px">Nothing logged yet</div>'+
    '<p style="margin:0 0 14px;color:var(--ink-2);font-size:13px">Start this in your first month. '+
    'Hours, dates and a contact for each activity are exactly what applications ask for later, '+
    'and they\'re painful to reconstruct from memory.</p>'+
    '<button class="btn" onclick="editActivity()">+ Add activity</button></div>';
  const mean=list.filter(a=>a.meaningful).length;
  h+='<div class="card" style="padding:0;margin-bottom:16px"><div style="display:flex">'+
    gstat(Math.round(totalHours()), "total hours", list.length+" activities")+
    gstat(Math.round(list.filter(a=>/clinical|shadow/i.test(a.category||"")).reduce((s,a)=>s+actHours(a),0)),
          "clinical", "incl. shadowing")+
    gstat(Math.round(list.filter(a=>/research/i.test(a.category||"")).reduce((s,a)=>s+actHours(a),0)),
          "research", mean+"/3 flagged")+
    '</div></div>';
  h+='<section class="sec"><div class="sec-h"><h2>By category</h2><div class="line"></div></div><div class="card">';
  for(const [cat,hrs] of hoursByCat()){
    const pc=totalHours()>0?hrs/totalHours()*100:0;

  h+='<section class="sec"><div class="sec-h"><h2>Activities</h2><div class="line"></div>'+
     '<button class="btn ghost sm" onclick="editActivity()">+ Add</button></div><div class="stack">';

        '</div></div>'+
      '<div style="text-align:right;flex:none">'+
        '<div class="num" style="font-size:16px;font-weight:700">'+Math.round(actHours(a))+'<span style="font-size:11px">h</span></div>'+
        '<button class="btn ghost sm" data-logh="'+a.id+'" style="margin-top:4px">+ Hours</button></div>'+
      '<button class="hbtn" data-aedit="'+a.id+'" aria-label="Edit activity"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></button>'+

  h+=sec("Syllabus",

    '<p class="hint">Paste or upload the schedule; every dated line becomes a proposed item you approve first. Grade weights like “Homework 20%” get picked up too.</p></div>');
  const ps=pushState;
  const pstate = ps.perm==="unsupported" ? ["unsupported","This browser can't show notifications."]
    : ps.perm==="denied" ? ["blocked","This site is blocked from sending notifications. Chrome → site settings → Notifications → Allow, then come back."]
    : ps.sub ? ["on","This device is registered. Reminders arrive even when the app is closed."]
    : ["off","This device is not registered yet. Push has to be switched on from each device separately."];
  h+=sec("Reminders",
    '<div class="card">'+
    '<div class="row" style="margin-bottom:11px"><div class="grow"><div style="font-weight:700;font-size:14px">Phone push</div>'+
    '<div class="hint" style="margin:1px 0 0">'+pstate[1]+'</div></div>'+
    '<span class="pill '+(pstate[0]==="on"?"ok":pstate[0]==="off"?"warn":"bad")+'">'+pstate[0]+'</span></div>'+
    (pstate[0]==="on"
      ? '<div class="row" style="flex-wrap:wrap"><button class="btn ghost sm" id="s_ptest">Send test</button>'+
        '<button class="btn ghost sm" id="s_pre">Re-register</button>'+
        '<button class="btn ghost sm" id="s_poff">Turn off</button></div>'
      : pstate[0]==="off" ? '<button class="btn wide" id="s_pon">Turn on push</button>' : "")+
    '<div class="hint" style="margin-top:9px;font-family:var(--mono);font-size:11px;line-height:1.7">'+
      'this device &middot; opened as '+(ps.standalone?'<b>installed app</b>':'<b style="color:var(--shoal)">browser tab</b>')+'<br>'+
      'permission <b>'+esc(ps.perm||"?")+'</b> &middot; service worker <b>'+(ps.swOK?"ok":"missing")+'</b><br>'+
      'subscription <b>'+(ps.sub?"yes":"no")+'</b>'+(ps.host?' &middot; via '+esc(ps.host):'')+
      (ps.err?'<br><span style="color:var(--shoal)">'+esc(ps.err)+'</span>':'')+
    '</div>'+
    (s.srcSubs!=null?'<p class="hint" style="margin:8px 0 0">Devices armed for push: <b>'+s.srcSubs+'</b>. '+
      'Each phone or laptop has to be turned on separately, from that device.</p>':'')+
    '<hr style="border:none;border-top:1px solid var(--rule-2);margin:14px 0">'+
    '<label class="f"><span>Email for reminders</span><input type="email" id="s_e" value="'+esc(s.email)+'" placeholder="you@pitt.edu" autocapitalize="off"></label>'+
    (s.srcEmailKey===false?'<p class="hint" style="color:var(--shoal)">No RESEND_KEY on the worker — email can\'t send.</p>'
     :s.srcEmailTo===false?'<p class="hint" style="color:var(--shoal)">The worker doesn\'t have your address yet. Save reminder settings below.</p>':'')+
    '<label class="f"><span>Daily digest hour (0–23, your time)</span><input type="number" min="0" max="23" id="s_h" value="'+s.digestHour+'"></label>'+
    '<label class="f"><span>Warn me this many days ahead</span>'+
      '<div class="row" id="s_lead" style="flex-wrap:wrap">'+[0,1,2,3,5,7,14].map(n=>
        '<button class="btn sm '+(s.leadDays.includes(n)?"":"ghost")+'" data-ld="'+n+'">'+(n===0?"day of":n+"d")+'</button>').join("")+
      '</div></label>'+
    '<button class="btn ghost wide" id="s_rsave">Save reminder settings</button>'+
    '<p class="hint">Push must be switched on <b>separately on every device</b>, from that device, with the app installed to the home screen. '+
    'Email sends from the worker, so it only needs to be saved once — but the address must match the one you signed up to Resend with, '+
    'because the default sender can only reach that address.</p></div>');
  h+=sec("Calendar & backup",
    '<div class="card stack">'+
    '<button class="btn ghost wide" onclick="exportICS()">Export .ics for Google / Apple / Outlook</button>'+
    '<button class="btn ghost wide" id="s_exp">Export backup (JSON)</button>'+
    '<label class="btn ghost wide" style="display:block;text-align:center">Import backup<input type="file" id="s_imp" accept=".json" hidden></label>'+
    '<p class="hint">Everything lives in this browser\'s local storage. Export every few weeks — clearing site data wipes it.</p></div>');
  h+=sec("Planner",
    '<div class="card"><label class="f"><span>Daily study ceiling (minutes)</span>'+
    '<input type="number" min="30" step="15" id="s_cap" value="'+s.dailyCapMin+'"></label>'+
    '<label class="f"><span>Default target grade (%)</span><input type="number" min="0" max="100" id="s_tg" value="'+s.target+'"></label>'+
    '<button class="btn ghost wide" id="s_psave">Save</button></div>');
  h+=sec("Reset",'<button class="btn danger wide" id="s_wipe">Erase everything on this device</button>');
  h+='<p class="hint" style="text-align:center;margin-top:20px">Due North · '+live().length+' items · '+courseList().length+' courses</p>';
  return h;
}
function bindSetup(root){
  const g=id=>root.querySelector(id);
  const grab=()=>{ D.settings.workerUrl=g("#s_w").value.trim(); D.settings.appKey=g("#s_k").value.trim(); };
  g("#s_test").onclick=async()=>{ grab(); save(false);
    try{
      const r=await api("/health");
      const src=[]; if(r.canvas) src.push("Canvas API"); if(r.ics) src.push("calendar feed");
      const extra=[]; if(r.busy) extra.push("timetable"); if(r.email) extra.push("email"); if(r.push) extra.push("push");
      D.settings.srcSubs=r.subs; D.settings.srcEmailKey=!!r.email; D.settings.srcEmailTo=!!r.emailTo;
      toast(src.length
        ? "Connected · "+src.join(" + ")+(extra.length?" · "+extra.join(", "):"")
        : "Connected · no due-date source set (ICS_URL or CANVAS_TOKEN)");
      D.settings.srcCanvas=!!r.canvas; D.settings.srcIcs=!!r.ics; D.settings.srcBusy=!!r.busy;
      save(false); render(); tellSW();
    }
    catch(e){ toast(e.message.slice(0,90)); } };
  g("#s_sync").onclick=()=>{ grab(); save(false); syncEverything(); };
  g("#s_cnow").onclick=()=>{ grab(); save(false); cloudSync(false); };
  g("#s_pair").onclick=()=>{ grab(); save(false); pairSheet(); };
  g("#s_ctog").onclick=()=>{
    D.settings.sync = D.settings.sync===false;
    save(false); render();
    toast(D.settings.sync?"Sync on":"Sync off — this device is now local only");
    if(D.settings.sync) cloudSync(false);
  };
  g("#s_cwipe").onclick=async()=>{
    if(!confirm("Erase the synced copy on the worker? Data on your devices is untouched, and the next sync from either one will repopulate it.")) return;
    try{ await api("/sync/reset",{method:"POST",body:"{}"}); toast("Synced copy erased"); }
    catch(e){ toast(e.message.slice(0,90)); }
  };
  const pon=g("#s_pon"); if(pon) pon.onclick=()=>{ grab(); save(false); enablePush(); };
  const poff=g("#s_poff"); if(poff) poff.onclick=disablePush;
  const pre=g("#s_pre"); if(pre) pre.onclick=()=>{ grab(); save(false); reRegisterPush(); };
  const pt=g("#s_ptest"); if(pt) pt.onclick=async()=>{
    try{
      const r=await api("/push/test",{method:"POST",body:"{}"});
      D.settings.srcSubs=r.devices; save(false);
      const parts=[];
      parts.push(r.pushed?("pushed to "+r.pushed+" of "+r.devices+" device"+(r.devices===1?"":"s"))
        : (r.devices?"push failed on all "+r.devices+" devices":"no devices armed — turn push on here"));
      parts.push(r.emailed?("emailed "+(r.emailTo||"")):("email failed — "+(r.emailWhy||"unknown")));
      toast(parts.join(" · "));
      render();
    }catch(e){ toast(e.message.slice(0,90)); } };
  root.querySelectorAll("[data-ld]").forEach(b=>b.onclick=()=>{
    const n=+b.dataset.ld, l=D.settings.leadDays;
    D.settings.leadDays = l.includes(n) ? l.filter(x=>x!==n) : l.concat(n).sort((a,b)=>b-a);
    touchSettings(); save(); render();
  });
  g("#s_rsave").onclick=async()=>{ grab();
    D.settings.email=g("#s_e").value.trim();
    D.settings.digestHour=Math.max(0,Math.min(23,parseInt(g("#s_h").value)||7));
    touchSettings(); save(false); await cloudSync(true); tellSW(); render(); toast("Reminder settings saved"); };
  const wsave=g("#s_wsave");
  if(wsave) wsave.onclick=()=>{
    D.settings.wakeHour=Math.max(0,Math.min(23,parseInt(g("#s_wake").value)||9));
    D.settings.sleepHour=Math.max(1,Math.min(24,parseInt(g("#s_bed").value)||22));
    D.settings.sessionMin=Math.max(10,parseInt(g("#s_sess").value)||30);
    D.settings.restMin=Math.max(0,parseInt(g("#s_rest").value)||0);
    D.settings.bufferMin=Math.max(0,parseInt(g("#s_buf").value)||0);
    touchSettings(); buildPlan(); render(); toast("Hours saved — plan rebuilt");
  };
  const bb=g("#s_busy");
  if(bb) bb.onclick=async()=>{
    grab(); save(false);
    const ok=await refreshBusy(true);
    if(ok){ buildPlan(); render(); toast((D.busy||[]).length+" calendar events loaded"); }
    else toast("No calendar feed set on the worker yet");
  };
  const wa=g("#s_waddw");
  if(wa) wa.onclick=()=>{
    openSheet("Recurring commitment",
      '<label class="f"><span>What is it</span><input id="w_t" placeholder="CHEM 0310 lecture"></label>'+
      '<label class="f"><span>Days</span><div class="row" id="w_d" style="flex-wrap:wrap">'+
        DOW3.map((d,i)=>'<button class="btn ghost sm" data-wd="'+i+'">'+d+'</button>').join("")+'</div></label>'+
      '<div class="two"><label class="f"><span>Starts</span><input type="time" id="w_s" value="10:00"></label>'+
      '<label class="f"><span>Minutes</span><input type="number" id="w_m" min="15" step="5" value="50"></label></div>'+
      '<button class="btn wide" id="w_ok">Add commitment</button>');
    const picked=new Set();
    $("#w_d").querySelectorAll("[data-wd]").forEach(b=>b.onclick=()=>{
      const i=+b.dataset.wd;
      if(picked.has(i)){ picked.delete(i); b.classList.add("ghost"); } else { picked.add(i); b.classList.remove("ghost"); }
    });
    $("#w_ok").onclick=()=>{
      if(!picked.size) return toast("Pick at least one day");
      D.weekly.push(touch({id:uid(),title:$("#w_t").value.trim()||"Commitment",
        days:[...picked].sort(),start:$("#w_s").value||"10:00",min:parseInt($("#w_m").value)||50}));
      buildPlan(); closeSheet(); render(); toast("Added");
    };
  };
  root.querySelectorAll("[data-wdel]").forEach(b=>b.onclick=()=>{
    const w=D.weekly.find(x=>x.id===b.dataset.wdel);
    w.del=true; touch(w); buildPlan(); render();
  });
  g("#s_psave").onclick=()=>{ D.settings.dailyCapMin=Math.max(30,parseInt(g("#s_cap").value)||180);
    D.settings.target=Math.max(0,Math.min(100,parseFloat(g("#s_tg").value)||90));
    touchSettings(); buildPlan(); render(); toast("Saved"); };
  g("#s_exp").onclick=()=>dl("due-north-backup-"+dkey(new Date())+".json", JSON.stringify(D,null,1));
  g("#s_imp").onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{
      const d=JSON.parse(await f.text());
      if(!d||!Array.isArray(d.items)) throw 0;
      if(!confirm("Replace everything on this device with the backup?")) return;
      D=d; D.settings=Object.assign(blank().settings,D.settings||{}); save(); render(); toast("Backup restored");
    }catch(err){ toast("That file isn't a Due North backup"); }
  };
  g("#s_wipe").onclick=()=>{
    if(!confirm("Erase all courses, items and settings on this device?")) return;
    localStorage.removeItem(KEY); D=blank(); save(false); render(); toast("Erased");
  };
}

/* ---------------- render ---------------- */
const VIEWS={today:vToday, chart:vChart, grades:vGrades, plan:vPlan, log:vLog, setup:vSetup};
function syncTabs(){ document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab)); }
function render(){
  renderBearing();
  const root=$("#view");
  root.innerHTML=VIEWS[tab]();
  bindRows(root);
  if(tab==="chart"){
    root.querySelectorAll(".cell").forEach(c=>c.onclick=()=>{ selKey=c.dataset.k; render(); });
    root.querySelector("#pm").onclick=()=>{ calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1); render(); };
    root.querySelector("#nm").onclick=()=>{ calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1); render(); };
  }
  if(tab==="grades") bindGrades(root);
  if(tab==="plan") bindPlan(root);
  if(tab==="log") bindLog(root);
  if(tab==="setup"){
    bindSetup(root);
    if(!pushState.checked) checkPush().then(()=>{ if(tab==="setup") render(); });
  }
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{
  tab=b.dataset.tab; syncTabs(); render(); window.scrollTo(0,0);
});
$("#syncBtn").onclick=syncEverything;
$("#setupBtn").onclick=()=>{ tab="setup"; syncTabs(); render(); window.scrollTo(0,0); };
document.addEventListener("visibilitychange",()=>{
  if(document.hidden) return;
  renderBearing();
  // coming back to the app is exactly when the other device's work should land
  if(W() && Date.now()-(D.settings.lastCloud||0) > 90000) cloudSync(true).then(()=>render());
});
setInterval(renderBearing, 300000);
let rzT; window.addEventListener("resize",()=>{ clearTimeout(rzT); rzT=setTimeout(renderBearing,150); });

/* ---------------- boot ---------------- */
(function consumePairLink(){
  const m=(location.hash||"").match(/^#s=(.+)$/);
  if(!m) return;
  try{
    const p=JSON.parse(atob(decodeURIComponent(m[1])));
    if(p&&p.u){
      D.settings.workerUrl=p.u; D.settings.appKey=p.k||""; D.settings.sync=true;
      save(false);
      setTimeout(()=>toast("Paired — pulling your data"),500);
    }
  }catch(e){ setTimeout(()=>toast("That pairing link was incomplete"),500); }
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
})();
render();
registerSW().then(()=>{ if(W()) tellSW(); });
if(W()){
  setTimeout(async()=>{
    await cloudSync(true);
    if(Date.now()-(D.settings.lastSync||0) > 3600000) await syncCanvas(true);
    await refreshBusy(false);
    buildPlan(false);
    render();
  }, 900);
}
</script>
